components:
  schemas:
    BankTransferGetResponse:
      type: object
      description: BankTransferGetResponse
      properties:
        create_time:
          type: string
          maxLength: 36
          description: Create Time
        currency:
          type: string
          description: Acceptable currencies for a billing group.
          title: AcceptedCurrency
          enum:
          - AUD
          - CAD
          - CHF
          - DKK
          - EUR
          - GBP
          - JPY
          - NOK
          - NZD
          - SEK
          - SGD
          - USD
        organization_id:
          type: string
          maxLength: 36
          description: Organization's ID
        payment_method_id:
          type: string
          maxLength: 36
          description: Payment method ID
        payment_terms_days:
          type: integer
          description: Payment Terms Days
        state:
          type: string
          description: Payment method state
        update_time:
          type: string
          maxLength: 36
          description: Update Time
      required:
      - create_time
      - currency
      - organization_id
      - payment_method_id
      - payment_terms_days
      - state
      - update_time
    CreditCardListResponse:
      type: object
      description: CreditCardListResponse
      properties:
        credit_cards:
          type: array
          description: Credit Cards
          items:
            type: object
            properties:
              brand:
                type: string
                description: Brand
              create_time:
                type: string
                maxLength: 36
                description: Create Time
              exp_month:
                type: integer
                description: Exp Month
              exp_year:
                type: integer
                description: Exp Year
              last4:
                type: string
                description: Last4
              name:
                type: string
                description: Name
              organization_id:
                type: string
                maxLength: 36
                description: Organization's ID
              payment_method_id:
                type: string
                maxLength: 36
                description: Payment method ID
              state:
                type: string
                description: Payment method state
              update_time:
                type: string
                maxLength: 36
                description: Update Time
            required:
            - brand
            - create_time
            - exp_month
            - exp_year
            - last4
            - name
            - organization_id
            - payment_method_id
            - state
            - update_time
      required:
      - credit_cards
    CreditCardCreateRequestBody:
      type: object
      description: CreditCardCreateRequestBody
      properties:
        stripe_payment_method_id:
          type: string
          description: Stripe payment method ID
      required:
      - stripe_payment_method_id
    CreditCardGetResponse:
      type: object
      description: CreditCardGetResponse
      properties:
        brand:
          type: string
          description: Brand
        create_time:
          type: string
          maxLength: 36
          description: Create Time
        exp_month:
          type: integer
          description: Exp Month
        exp_year:
          type: integer
          description: Exp Year
        last4:
          type: string
          description: Last4
        name:
          type: string
          description: Name
        organization_id:
          type: string
          maxLength: 36
          description: Organization's ID
        payment_method_id:
          type: string
          maxLength: 36
          description: Payment method ID
        state:
          type: string
          description: Payment method state
        update_time:
          type: string
          maxLength: 36
          description: Update Time
      required:
      - brand
      - create_time
      - exp_month
      - exp_year
      - last4
      - name
      - organization_id
      - payment_method_id
      - state
      - update_time
    PaymentMethodCustomGetResponse:
      type: object
      description: PaymentMethodCustomGetResponse
      properties:
        create_time:
          type: string
          maxLength: 36
          description: Create Time
        organization_id:
          type: string
          maxLength: 36
          description: Organization's ID
        payment_method_id:
          type: string
          maxLength: 36
          description: Payment method ID
        state:
          type: string
          description: Payment method state
        type:
          type: string
          description: An enumeration.
          title: PaymentMethodCustomType
          enum:
          - disabled
          - no_payment_expected
          - partner
        update_time:
          type: string
          maxLength: 36
          description: Update Time
      required:
      - create_time
      - organization_id
      - payment_method_id
      - state
      - type
      - update_time
    PaymentMethodsListResponse:
      type: object
      description: PaymentMethodsListResponse
      properties:
        payment_methods:
          type: array
          description: Payment Methods
          items:
            type: object
            properties:
              payment_method_id:
                type: string
                maxLength: 36
                description: Payment method ID
              payment_method_type:
                type: string
                description: An enumeration.
                title: Payment method type
                enum:
                - aws_subscription
                - azure_subscription
                - bank_transfer
                - credit_card
                - gcp_subscription
                - custom
            required:
            - payment_method_id
            - payment_method_type
      required:
      - payment_methods
    CreditCardDeleteResponse:
