              title: Target cluster alias
            topics:
              type: array
              maxItems: 8192
              description: Topic names and regular expressions that match topic names that should be replicated. MirrorMaker will replicate these topics if they are not matched by &quot;topics.exclude&quot;. Currently defaults to [&quot;.*&quot;].
              title: List of topics and/or regular expressions to replicate.
