            download_cookie:
              type: string
              description: Download Cookie
            due_date:
              type: string
              maxLength: 36
              description: Due Date
            generated_at:
              type: string
              maxLength: 36
              description: Generated At
            invoice_number:
              type: string
              minLength: 1
              description: Invoice Number
            issue_date:
              type: string
              maxLength: 36
              description: Issue Date
            period_begin:
              type: string
              maxLength: 36
              description: Period Begin
            period_end:
              type: string
              maxLength: 36
              description: Period End
            state:
              type: string
              maxLength: 36
              description: State
            total_inc_vat:
