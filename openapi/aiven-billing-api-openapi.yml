              maxLength: 16
              description: Total Inc Vat
            total_vat_zero:
              type: string
              maxLength: 16
              description: Total Vat Zero
          required:
          - billing_group_id
          - billing_group_name
          - billing_group_state
          - currency
          - generated_at
          - invoice_number
          - period_begin
          - period_end
