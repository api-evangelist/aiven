components:
  schemas:
    OrganizationAddressCreateRequestBody:
      type: object
      description: OrganizationAddressCreateRequestBody
      properties:
        address_lines:
          type: array
          minItems: 1
          maxItems: 3
          description: Address lines
          items:
            type: string
        city:
          type: string
          maxLength: 50
          description: City
        country_code:
          type: string
          maxLength: 2
          description: Country Code
        name:
          type: string
          minLength: 1
          maxLength: 83
          description: Name
        state:
          type: string
          maxLength: 30
          description: State
        zip_code:
          type: string
          maxLength: 36
          description: Zip Code
      required:
      - address_lines
      - city
      - country_code
      - name
    OrganizationAddressDeleteResponse:
      type: object
      description: OrganizationAddressDeleteResponse
      properties:
        errors:
          type: array
          description: List of errors occurred during request processing
          items:
            type: object
            properties:
              message:
                type: string
                description: Printable error message
              more_info:
                type: string
                description: URL to the documentation of the error
              status:
                type: integer
                description: HTTP error status code
            required:
            - message
            - status
        message:
          type: string
          description: Printable result of the request
    OrganizationAddressGetResponse:
      type: object
      description: OrganizationAddressGetResponse
      properties:
        address_id:
          type: string
          maxLength: 36
          description: Address ID
        address_lines:
          type: array
          minItems: 1
          maxItems: 3
          description: Address lines
          items:
            type: string
        city:
          type: string
          maxLength: 50
          description: City
        country_code:
          type: string
          maxLength: 2
          description: Country Code
        create_time:
          type: string
          maxLength: 36
          description: Create Time
        name:
          type: string
          minLength: 0
          maxLength: 83
          description: Name
        organization_id:
          type: string
          maxLength: 36
          description: Organization ID
        state:
          type: string
          maxLength: 30
          description: State
        update_time:
          type: string
          maxLength: 36
          description: Update Time
        zip_code:
          type: string
          maxLength: 36
          description: Zip Code
      required:
      - address_id
      - country_code
      - create_time
      - name
      - organization_id
      - update_time
