          type: object
          description: InvoiceModel
          properties:
            billing_group_id:
              type: string
              minLength: 36
              maxLength: 36
              description: Billing Group ID
            billing_group_name:
              type: string
              minLength: 1
              maxLength: 128
              description: Billing Group Name
            billing_group_state:
              type: string
              description: Billing group state
            currency:
              type: string
              maxLength: 16
