    get:
      summary: Get organization address info
      tags:
      - Billing
      operationId: OrganizationAddressGet
      parameters:
      - $ref: '#/components/parameters/organization_id'
      - $ref: '#/components/parameters/address_id'
      responses:
        '200':
          description: Response
          content:
