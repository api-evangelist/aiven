        rename_alias_pattern:
          type: string
          maxLength: 4096
          description: Rename pattern for aliases
        rename_alias_replacement:
          type: string
          maxLength: 4096
          description: Rename replacement for aliases
        rename_pattern:
          type: string
          maxLength: 4096
          description: Rename pattern for indices
        rename_replacement:
          type: string
          maxLength: 4096
