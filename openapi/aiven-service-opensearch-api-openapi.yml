openapi: 3.2.0
info:
  contact:
    email: support@aiven.io
    name: Aiven support team
    url: https://aiven.io/support-services
  title: 'Aiven API Documentation Service: Open Search API'
  version: v1
  x-logo:
    altText: Aiven logo
    backgroundColor: '#fafafa'
    href: https://api.aiven.io/doc
    url: https://aiven.io/assets/img/aiven-logo.png
  description: '# Introduction


    Direct link to openapi.json for use with external tools


    Aiven is a modern fully-managed open source data platform for streaming, storing, and analyzing data on any public cloud.'
servers:
- url: https://api.aiven.io/v1
tags:
- name: Service:_OpenSearch
  x-displayName: 'Service: OpenSearch'
paths:
  /project/{project}/service/{service_name}/opensearch/acl:
    get:
      summary: Show OpenSearch ACL configuration
      tags:
      - Service:_OpenSearch
      operationId: ServiceOpenSearchAclGet
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/service_name'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOpenSearchAclGetResponse'
      security:
      - tokenAuth: []
        oauth2:
        - services:read
    post:
      summary: Set OpenSearch ACL configuration
      tags:
      - Service:_OpenSearch
      operationId: ServiceOpenSearchAclSet
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/service_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOpenSearchAclSetRequestBody'
            example:
              opensearch_acl_config:
                acls:
                - rules:
                  - index: ind*
                    permission: deny
                  username: admin*
                enabled: false
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOpenSearchAclSetResponse'
      security:
      - tokenAuth: []
        oauth2:
        - services:write
    put:
      summary: Update OpenSearch ACL configuration
      tags:
      - Service:_OpenSearch
      operationId: ServiceOpenSearchAclUpdate
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/service_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOpenSearchAclUpdateRequestBody'
            example:
              opensearch_acl_config:
                acls:
                - rules:
                  - index: ind*
                    permission: deny
                  username: admin*
                enabled: false
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOpenSearchAclUpdateResponse'
      security:
      - tokenAuth: []
        oauth2:
        - services:write
  /project/{project}/service/{service_name}/opensearch/{index_pattern}/_close:
    post:
      summary: Open OpenSearch indices
      tags:
      - Service:_OpenSearch
      operationId: ServiceOpenSearchIndexClose
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/service_name'
