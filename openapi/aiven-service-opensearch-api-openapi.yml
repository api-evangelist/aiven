components:
  schemas:
    ServiceOpensearchListCustomReposResponse:
      type: object
      description: ServiceOpensearchListCustomReposResponse
      properties:
        errors:
          type: array
          description: List of errors occurred during request processing
          items:
            type: object
            properties:
              message:
                type: string
                description: Printable error message
              more_info:
                type: string
                description: URL to the documentation of the error
              status:
                type: integer
                description: HTTP error status code
            required:
            - message
            - status
        message:
          type: string
          description: Printable result of the request
        repositories:
          type: array
          description: List of custom repositories
          items:
            type: object
            properties:
              name:
                type: string
                description: Repository name
              settings:
                type: object
                description: Repository settings
                properties:
                  base_path:
                    type: string
                    description: Base path
                required:
                - base_path
              type:
                type: string
                description: Repository type
            required:
            - name
            - settings
            - type
      required:
      - repositories
    ServiceOpensearchListRestorationsInProgressResponse:
      type: object
      description: ServiceOpensearchListRestorationsInProgressResponse
      properties:
        errors:
          type: array
          description: List of errors occurred during request processing
          items:
            type: object
            properties:
              message:
                type: string
                description: Printable error message
              more_info:
                type: string
                description: URL to the documentation of the error
              status:
                type: integer
                description: HTTP error status code
            required:
            - message
            - status
        message:
          type: string
          description: Printable result of the request
        snapshots:
          type: array
          description: List of running restorations
          items:
            type: object
            properties:
              repo_name:
                type: string
                description: Repository name
              running_time_in_nanos:
                type: integer
                description: Running time in nanoseconds
              snapshot_name:
                type: string
                description: Snapshot name
              start_time_in_millis:
                type: integer
                description: Restoration start time in milliseconds
            required:
            - snapshot_name
    ServiceOpensearchTieredStorageSummaryResponse:
      type: object
      description: ServiceOpensearchTieredStorageSummaryResponse
      properties:
        current_cost:
          type: string
          description: The current cost in USD of tiered storage since the beginning of the billing period
        errors:
          type: array
          description: List of errors occurred during request processing
          items:
            type: object
            properties:
              message:
                type: string
                description: Printable error message
              more_info:
                type: string
                description: URL to the documentation of the error
              status:
                type: integer
                description: HTTP error status code
            required:
            - message
            - status
        forecasted_cost:
          type: string
          description: The forecasted cost in USD of tiered storage in the billing period
        forecasted_rate:
          type: string
          description: The rate on GBs/hour used to calculate the forecasted cost
        message:
          type: string
          description: Printable result of the request
        storage_usage_history:
          type: object
          description: History of usage and cumulative costs in the billing period
          properties:
            hourly:
              type: array
              description: History by hour
              items:
                type: object
                properties:
                  estimated_cost:
                    type: string
                    description: The estimated cost in USD of tiered storage for this hour
                  hour_start:
                    type: string
                    maxLength: 36
                    description: Timestamp in ISO 8601 format, always in UTC
                  peak_stored_bytes:
                    type: integer
                    minimum: 0
                    description: Peak bytes stored on object storage at this hour
                required:
                - hour_start
                - peak_stored_bytes
          required:
          - hourly
        total_storage_usage:
          type: integer
          minimum: 0
          description: Total storage usage by tiered storage, in bytes
      required:
      - current_cost
      - forecasted_cost
      - storage_usage_history
      - total_storage_usage
    ServiceOpenSearchIndexListResponse:
      type: object
      description: ServiceOpenSearchIndexListResponse
      properties:
        errors:
          type: array
          description: List of errors occurred during request processing
          items:
            type: object
            properties:
              message:
                type: string
                description: Printable error message
              more_info:
                type: string
                description: URL to the documentation of the error
              status:
                type: integer
                description: HTTP error status code
            required:
            - message
            - status
        indexes:
          type: array
          description: List of OpenSearch indexes
          items:
            type: object
            properties:
              create_time:
                type: string
                maxLength: 36
                description: Timestamp in ISO 8601 format, always in UTC
              docs:
                type: integer
                description: Number of documents in index. -1 means not available.
              health:
                type: string
                description: Index health
                enum:
                - green
                - yellow
                - red
                - red*
                - unknown
              index_name:
                type: string
                description: Index name
              number_of_replicas:
                type: integer
                minimum: 0
                description: Number of replicas for an index
              number_of_shards:
                type: integer
                minimum: 1
                description: Number of shards in an index
              read_only_allow_delete:
                type: boolean
                description: Whether an index is set as read-only (but allows deletion). null means unknown.
              replication:
                type: object
                description: Index replication
                properties:
                  leader_index:
                    type: string
                    description: Leader index name
                  leader_project:
                    type: string
                    description: Leader project name
                  leader_service:
                    type: string
                    description: Leader service name
              size:
                type: integer
                description: Index size in bytes. -1 means not available.
              status:
                type: string
                description: Index status
                enum:
                - unknown
                - open
                - close
                - none
            required:
            - create_time
            - index_name
            - number_of_replicas
            - number_of_shards
        message:
          type: string
          description: Printable result of the request
      required:
      - indexes
    ServiceOpenSearchSecuritySetResponse:
      type: object
      description: ServiceOpenSearchSecuritySetResponse
      properties:
