        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOpenSearchIndexCloseResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    title: Human readable error message
                  errors:
                    type: array
                    title: List of error details. Typically there is only one element
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          title: Human readable error message
                        error_code:
                          type: string
                          enum:
                          - index_close_failed
                          title: Machine processable error code. Clients must be prepared to handle new codes.
                          description: 'index_close_failed: Index close failed'
        '409':
          description: Request conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    title: Human readable error message
                  errors:
                    type: array
                    title: List of error details. Typically there is only one element
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          title: Human readable error message
                        error_code:
                          type: string
                          enum:
                          - not_powered
                          title: Machine processable error code. Clients must be prepared to handle new codes.
                          description: 'not_powered: Service is not powered'
        '429':
          description: The user has sent too many requests in a given amount of time ("rate limiting")
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    title: Human readable error message
                  errors:
                    type: array
                    title: List of error details. Typically there is only one element
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          title: Human readable error message
                        error_code:
                          type: string
                          enum:
                          - opensearch_too_many_requests
                          title: Machine processable error code. Clients must be prepared to handle new codes.
                          description: 'opensearch_too_many_requests: OpenSearch service is not able to process the request due to too many requests'
        '502':
          description: Invalid responses from another server/proxy
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    title: Human readable error message
                  errors:
                    type: array
                    title: List of error details. Typically there is only one element
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          title: Human readable error message
                        error_code:
                          type: string
                          enum:
                          - opensearch_service_unavailable
                          title: Machine processable error code. Clients must be prepared to handle new codes.
                          description: 'opensearch_service_unavailable: OpenSearch service is not able to process the request'
      security:
      - tokenAuth: []
        oauth2:
        - services:write
