            cloud_provider:
              type: string
              description: Cloud provider for the BYOC cloud
              enum:
              - aws
              - azure
              - google
              - oracle
            cloud_region:
              type: string
              maxLength: 32
              description: Cloud region for the BYOC cloud
            contact_emails:
              type: array
