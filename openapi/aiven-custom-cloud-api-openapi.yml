components:
  schemas:
    CustomCloudEnvironmentDeleteResponse:
      type: object
      description: CustomCloudEnvironmentDeleteResponse
      properties:
        errors:
          type: array
          description: List of errors occurred during request processing
          items:
            type: object
            properties:
              message:
                type: string
                description: Printable error message
              more_info:
                type: string
                description: URL to the documentation of the error
              status:
                type: integer
                description: HTTP error status code
            required:
            - message
            - status
        message:
          type: string
          description: Printable result of the request
    CustomCloudEnvironmentCreateRequestBody:
      type: object
      description: CustomCloudEnvironmentCreateRequestBody
      properties:
        cloud_provider:
          type: string
          description: Cloud provider for the BYOC cloud
          enum:
          - aws
          - azure
          - google
          - oracle
        cloud_region:
          type: string
          maxLength: 32
          description: Cloud region for the BYOC cloud
        contact_emails:
          type: array
          maxItems: 10
          description: Email addresses for notifications and alerts for this BYOC cloud
          items:
            type: object
            properties:
              email:
                type: string
                maxLength: 254
                description: User email address
              real_name:
                type: string
                maxLength: 256
                description: User real name
              role:
                type: string
                maxLength: 256
                description: Role of this user
            required:
            - email
        deployment_model:
          type: string
          description: Deployment model for the BYOC cloud
          enum:
          - direct_ipsec_ingress
          - ipsec_ingress
          - standard
          - standard_public
          - pci_dss
          - hipaa
        display_name:
          type: string
          maxLength: 64
          description: Short name for this BYOC cloud
        reserved_cidr:
          type: string
          maxLength: 18
          description: CIDR range reserved for Aiven provisioned networks in the BYOC cloud
        tags:
          type: object
          description: Set of resource tags
          properties: {}
      required:
      - cloud_provider
      - cloud_region
      - deployment_model
      - display_name
      - reserved_cidr
